<section class="page-head">
  <div>
    <h1>Customer Panel Control</h1>
    <p><code>rk/zypli-customer-panel-MARKETPLACE.html</code> ke sections — enable/disable aur monitor.</p>
  </div>
  <span class="pill live">{{ liveCount() }} / {{ sections().length }} Live</span>
</section>

<div class="section-grid">
  @for (s of sections(); track s.id) {
  <div class="section-card">
    <div class="sc-top">
      <div>
        <strong>{{ s.title }}</strong>
        <code>{{ s.desc }}</code>
      </div>
      <button class="switch" [class.on]="toggles()[s.id]" (click)="toggle(s.id)"
        aria-label="Toggle section"><span></span></button>
    </div>
    <div class="sc-foot">
      <span class="dot" [class.on]="toggles()[s.id]"></span>
      {{ toggles()[s.id] ? 'Live' : 'Disabled' }}
    </div>
  </div>
  }
</div>
